# Runs on every pull request and every push to main.
#
# Deno 2.9.7 is the version the repository uses (the Dockerfile's DENO_VERSION). Playwright 1.57.0
# is the version `deno task e2e` runs (deno.jsonc); the e2e image tag must match it, because the
# browser build inside the image is tied to that version.

when:
  - event: pull_request
  - event: push
    branch: main

steps:
  check:
    image: denoland/deno:2.9.7
    commands:
      - deno install --frozen
      - deno task check

  build:
    image: denoland/deno:2.9.7
    commands:
      - deno install --frozen
      - deno task build
    depends_on: [check]

  e2e:
    # The image carries Chromium and its system libraries, so nothing is installed through Deno
    # (`playwright install` downloads the browser and then hangs).
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    environment:
      RADICALE_URL: http://radicale:5232
    commands:
      # npm's newest `deno` package lags the binary, so take the pinned release itself.
      - |
          curl -fsSL -o /tmp/deno.zip https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
          unzip -q -o /tmp/deno.zip -d /usr/local/bin
          chmod +x /usr/local/bin/deno
      - deno --version
      - deno install --frozen
      # Radicale answers over TCP once it is up; wait for it before the first request.
      - |
          deno eval '
          for (let i = 0; ; i++) {
            try {
              (await Deno.connect({ hostname: "radicale", port: 5232 })).close()
              break
            } catch {
              if (i >= 60) {
                console.error("radicale did not accept connections within 60 s")
                Deno.exit(1)
              }
              await new Promise((resolve) => setTimeout(resolve, 1000))
            }
          }
          '
      - deno task e2e
    depends_on: [build]

services:
  radicale:
    # The same image and flags as infra/compose.dev.yml: any user name and password is accepted.
    image: ghcr.io/kozea/radicale:3.5.4
    # Woodpecker does not pass a service's `command` to the image, so the flags go in the entrypoint.
    entrypoint: ["/app/bin/python", "/app/bin/radicale", "--hosts", "0.0.0.0:5232", "--auth-type", "none"]
